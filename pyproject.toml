[project]
name = "pod-16"
version = "0.1.0"
description = "Private personal programmable backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.20,<2.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic-settings>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
